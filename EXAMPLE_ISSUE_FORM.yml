name: Media Post
description: Create a media post with images, videos, or audio
title: "[Media] "
labels: ["content", "media"]
body:
  - type: markdown
    attributes:
      value: |
        ## Create a Media Post

        Share photos, videos, or audio files with optional commentary.

        **To add media**: Drag and drop files directly into the **Content** field below.
        GitHub will automatically upload and insert them as markdown.

        **Supported formats**: JPG, PNG, GIF, WebP, SVG, MP4, MOV, WebM, MP3, WAV, FLAC, AAC, OGG

  - type: input
    id: title
    attributes:
      label: "Title"
      description: "Post title (required)"
      placeholder: "Lossless audio coming to Spotify"
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: "Content"
      description: |
        Write your post content in markdown. Drag and drop media files anywhere in the text.

        **Examples:**
        - Add commentary before/after media
        - Drop multiple files
        - Mix text and media freely

        GitHub will insert: `![filename](https://github.com/user-attachments/...)`
        Automation will convert this to `:::media` blocks with permanent CDN URLs.
      placeholder: |
        Write your content here...

        [Drag and drop images/videos/audio anywhere in this text]

        You can add more text after the media too!
      value: ""
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: "Tags"
      description: "Comma-separated tags (e.g., music, spotify, news)"
      placeholder: "music, spotify"

  - type: markdown
    attributes:
      value: |
        ---

        ### What happens next:
        1. GitHub uploads your dragged files and inserts markdown: `![file](url)`
        2. Automation downloads files and uploads to permanent CDN storage
        3. Markdown is transformed to `:::media` blocks with CDN URLs
        4. Pull request is created automatically with formatted content
        5. Review and merge the PR to publish!

        ### Tips:
        - **Markdown supported**: Use headings, lists, bold, italics, etc.
        - **Multiple files**: Drop as many as you need
        - **Alt text**: Edit `![alt text here](url)` for accessibility
        - **Mixed content**: Text + media works perfectly together
