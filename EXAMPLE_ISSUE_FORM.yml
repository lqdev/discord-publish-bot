name: Media Post
description: Create a media post with images, videos, or audio
title: "[Media] "
labels: ["content", "media"]
body:
  - type: markdown
    attributes:
      value: |
        ## Create a Media Post

        Share photos, videos, or audio files with optional commentary.

        **To add media**, choose any method:
        - **Drag-and-drop** files directly into the Content field
        - **Click "Attach files"** button at bottom of Content field
        - **Paste** (Ctrl+V / Cmd+V) images from clipboard
        - **Type URLs** for external media (YouTube, hosted images, etc.)

        All methods work! GitHub uploads automatically, external URLs stay as-is.

        **Supported formats**:
        - **Uploads**: JPG, PNG, GIF, WebP, SVG, MP4, MOV, WebM, MP3, WAV, FLAC, AAC, OGG
        - **Direct URLs**: Any direct file URL (https://example.com/image.jpg, video.mp4, etc.)
        - **Platform embeds**: YouTube (gets special thumbnail format), Vimeo, SoundCloud

  - type: input
    id: title
    attributes:
      label: "Title"
      description: "Post title (required)"
      placeholder: "Lossless audio coming to Spotify"
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: "Content"
      description: |
        Write your post content in markdown. Drag and drop media files anywhere in the text.

        **Examples:**
        - Add commentary before/after media
        - Upload multiple files (any method)
        - Mix text and media freely

        GitHub will insert markdown or HTML:
        - Drag-and-drop: `![filename](https://github.com/...)`
        - Attach button: `<img src="https://github.com/..." />`

        Automation converts both formats to `:::media` blocks with permanent CDN URLs.
      placeholder: |
        Write your content here...

        [Drag and drop images/videos/audio anywhere in this text]

        You can add more text after the media too!
      value: ""
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: "Tags"
      description: "Comma-separated tags (e.g., music, spotify, news)"
      placeholder: "music, spotify"

  - type: markdown
    attributes:
      value: |
        ---

        ### What happens next:
        1. GitHub uploads your dragged files and inserts markdown: `![file](url)`
        2. Automation downloads files and uploads to permanent CDN storage
        3. Markdown is transformed to `:::media` blocks with CDN URLs
        4. Pull request is created automatically with formatted content
        5. Review and merge the PR to publish!

        ### Tips:
        - **Markdown supported**: Use headings, lists, bold, italics, etc.
        - **Multiple files**: Drop as many as you need
        - **Alt text**: Edit `![alt text here](url)` for accessibility
        - **Mixed content**: Text + media works perfectly together
        - **External URLs**: Paste YouTube, Vimeo, or image URLs directly - no upload needed!
        - **Mix uploads & external**: You can combine GitHub uploads with external URLs in the same post
